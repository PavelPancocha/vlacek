<svg xmlns="http://www.w3.org/2000/svg" width="196" height="86" viewBox="0 0 196 86">
  <!-- Velká naftová lokomotiva: bogie side frames with springs and axle
       boxes, cab steps and the fixed light on the turning tyres. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d636c"/>
      <stop offset="0.35" stop-color="#363a41"/>
      <stop offset="1" stop-color="#16181b"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a707a"/>
      <stop offset="1" stop-color="#26282c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e7ec"/>
      <stop offset="0.5" stop-color="#9aa0a8"/>
      <stop offset="1" stop-color="#5b6068"/>
    </linearGradient>
    <linearGradient id="spring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a151b"/>
      <stop offset="0.4" stop-color="#d64541"/>
      <stop offset="1" stop-color="#7a151b"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round">
    <g stroke="#ffffff" stroke-opacity="0.38" stroke-width="1">
      <path d="M9.31 69.87 A12.1 12.1 0 0 1 24.13 61.31"/>
      <path d="M39.31 69.87 A12.1 12.1 0 0 1 54.13 61.31"/>
      <path d="M133.31 69.87 A12.1 12.1 0 0 1 148.13 61.31"/>
      <path d="M163.31 69.87 A12.1 12.1 0 0 1 178.13 61.31"/>
    </g>
    <g stroke="#000000" stroke-opacity="0.3" stroke-width="1.3">
      <path d="M32.69 76.13 A12.1 12.1 0 0 1 14.95 83.48"/>
      <path d="M62.69 76.13 A12.1 12.1 0 0 1 44.95 83.48"/>
      <path d="M156.69 76.13 A12.1 12.1 0 0 1 138.95 83.48"/>
      <path d="M186.69 76.13 A12.1 12.1 0 0 1 168.95 83.48"/>
    </g>
  </g>

  <g stroke="#111214" stroke-width="0.6" stroke-linejoin="round">
    <!-- Rear bogie (centre x 36, axles 21 and 51). -->
    <g>
      <path d="M31.6 52.6 V57 M40.4 52.6 V57" stroke="url(#spring)" stroke-width="3.2" stroke-linecap="butt"/>
      <path d="M30 53.6 H33.2 M30 55 H33.2 M38.8 53.6 H42 M38.8 55 H42" stroke="#5a1015" stroke-width="0.4"/>
      <path d="M12 57 H60 Q62 57 62 59 V61.6 Q62 63.4 60 63.4 H47 L44 66.6 H28 L25 63.4 H12 Q10 63.4 10 61.6 V59 Q10 57 12 57 Z" fill="url(#frame)"/>
      <path d="M12.4 58 H59.6" stroke="#8b9199" stroke-width="0.4"/>
      <circle cx="20" cy="60.2" r="1.4" fill="#16181b" stroke="none"/>
      <circle cx="52" cy="60.2" r="1.4" fill="#16181b" stroke="none"/>
      <rect x="32" y="63.4" width="8" height="5.4" rx="1.4" fill="url(#box)"/>
      <path d="M21 63.4 V68.4 M51 63.4 V68.4" stroke="url(#spring)" stroke-width="3.6" stroke-linecap="butt"/>
      <path d="M19.2 64.6 H22.8 M19.2 66 H22.8 M19.2 67.4 H22.8 M49.2 64.6 H52.8 M49.2 66 H52.8 M49.2 67.4 H52.8" stroke="#5a1015" stroke-width="0.4"/>
      <rect x="17" y="68.4" width="8" height="9" rx="1.2" fill="url(#box)"/>
      <rect x="47" y="68.4" width="8" height="9" rx="1.2" fill="url(#box)"/>
      <circle cx="21" cy="73" r="1.8" fill="#4a4f57" stroke-width="0.4"/>
      <circle cx="51" cy="73" r="1.8" fill="#4a4f57" stroke-width="0.4"/>
      <rect x="10.6" y="63.2" width="4.4" height="5.4" rx="0.8" fill="url(#frame)"/>
    </g>
    <!-- Front bogie (centre x 160, axles 145 and 175). -->
    <g>
      <path d="M155.6 52.6 V57 M164.4 52.6 V57" stroke="url(#spring)" stroke-width="3.2" stroke-linecap="butt"/>
      <path d="M154 53.6 H157.2 M154 55 H157.2 M162.8 53.6 H166 M162.8 55 H166" stroke="#5a1015" stroke-width="0.4"/>
      <path d="M136 57 H184 Q186 57 186 59 V61.6 Q186 63.4 184 63.4 H171 L168 66.6 H152 L149 63.4 H136 Q134 63.4 134 61.6 V59 Q134 57 136 57 Z" fill="url(#frame)"/>
      <path d="M136.4 58 H183.6" stroke="#8b9199" stroke-width="0.4"/>
      <circle cx="144" cy="60.2" r="1.4" fill="#16181b" stroke="none"/>
      <circle cx="176" cy="60.2" r="1.4" fill="#16181b" stroke="none"/>
      <rect x="156" y="63.4" width="8" height="5.4" rx="1.4" fill="url(#box)"/>
      <path d="M145 63.4 V68.4 M175 63.4 V68.4" stroke="url(#spring)" stroke-width="3.6" stroke-linecap="butt"/>
      <path d="M143.2 64.6 H146.8 M143.2 66 H146.8 M143.2 67.4 H146.8 M173.2 64.6 H176.8 M173.2 66 H176.8 M173.2 67.4 H176.8" stroke="#5a1015" stroke-width="0.4"/>
      <rect x="141" y="68.4" width="8" height="9" rx="1.2" fill="url(#box)"/>
      <rect x="171" y="68.4" width="8" height="9" rx="1.2" fill="url(#box)"/>
      <circle cx="145" cy="73" r="1.8" fill="#4a4f57" stroke-width="0.4"/>
      <circle cx="175" cy="73" r="1.8" fill="#4a4f57" stroke-width="0.4"/>
      <rect x="181" y="63.2" width="4.4" height="5.4" rx="0.8" fill="url(#frame)"/>
    </g>
    <!-- Cab steps under the doors. -->
    <path d="M163.6 46.6 V58 M169.8 46.6 V58 M26.2 46.6 V58 M32.4 46.6 V58" stroke="url(#steel)" stroke-width="0.8"/>
    <rect x="162.8" y="51.6" width="7.8" height="1.4" rx="0.4" fill="url(#steel)"/>
    <rect x="162.8" y="57.2" width="7.8" height="1.4" rx="0.4" fill="url(#steel)"/>
    <rect x="25.4" y="51.6" width="7.8" height="1.4" rx="0.4" fill="url(#steel)"/>
    <rect x="25.4" y="57.2" width="7.8" height="1.4" rx="0.4" fill="url(#steel)"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="164" height="100" viewBox="0 0 164 100">
  <!-- Hvězdičková mašinka (magic_stars): a fairy-tale steam engine in the
       same construction and light as the real ones, with a tulip chimney
       for the stars (no face, doc 07 §1). Rail top at y = 100, faces
       right, buffers 30 u above the rail. -->
  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b2c6f"/>
      <stop offset="0.18" stop-color="#a569bd"/>
      <stop offset="0.36" stop-color="#7d3c98"/>
      <stop offset="0.8" stop-color="#4a235a"/>
      <stop offset="1" stop-color="#2e1538"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e44ad"/>
      <stop offset="0.12" stop-color="#6c3483"/>
      <stop offset="1" stop-color="#3b1a48"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4f9a"/>
      <stop offset="0.5" stop-color="#22306b"/>
      <stop offset="1" stop-color="#141c45"/>
    </linearGradient>
    <linearGradient id="smokebox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1a48"/>
      <stop offset="0.2" stop-color="#7d3c98"/>
      <stop offset="0.42" stop-color="#4a235a"/>
      <stop offset="1" stop-color="#1f0e27"/>
    </linearGradient>
    <linearGradient id="chimney" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e1538"/>
      <stop offset="0.3" stop-color="#a569bd"/>
      <stop offset="0.55" stop-color="#5b2c6f"/>
      <stop offset="1" stop-color="#1f0e27"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#f4d03f"/>
      <stop offset="1" stop-color="#b7861a"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6f14"/>
      <stop offset="0.35" stop-color="#fff3c4"/>
      <stop offset="0.6" stop-color="#f4d03f"/>
      <stop offset="1" stop-color="#8a6312"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fdfaf0"/>
      <stop offset="0.5" stop-color="#b9d9ee"/>
      <stop offset="1" stop-color="#6c8fb8"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.85" r="0.75">
      <stop offset="0" stop-color="#ffd6f5" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#c39bd3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1f0e27" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.6" stop-color="#f9e79f"/>
      <stop offset="1" stop-color="#d4ac0d"/>
    </radialGradient>
  </defs>

  <g stroke="#1a0b21" stroke-width="0.6" stroke-linejoin="round">

<svg xmlns="http://www.w3.org/2000/svg" width="188" height="74" viewBox="0 0 188 74">
  <!-- Kontejnerový (cargo_container): fish-belly flat wagon on two bogies with two corrugated containers in different colours, no logos (doc 06). Rail top at y = 74, buffers 30 u above the rail. -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3d8de"/><stop offset="0.5" stop-color="#8b9199"/><stop offset="1" stop-color="#555a62"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f57"/><stop offset="0.4" stop-color="#2c2f35"/><stop offset="1" stop-color="#16181b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf5fb"/><stop offset="0.45" stop-color="#a9cde3"/><stop offset="1" stop-color="#5f8fae"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b8fd0"/><stop offset="0.5" stop-color="#2471a3"/><stop offset="1" stop-color="#154c75"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f39c4a"/><stop offset="0.5" stop-color="#d35400"/><stop offset="1" stop-color="#8f3a02"/>
    </linearGradient>
    <linearGradient id="frameBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f6d8a"/><stop offset="0.4" stop-color="#2f4a63"/><stop offset="1" stop-color="#1a2b3b"/>
    </linearGradient>
    <pattern id="ribsBlue" width="2.6" height="32" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1.1" height="32" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="1.3" y="0" width="1.1" height="32" fill="#000000" fill-opacity="0.18"/>
    </pattern>
    <pattern id="ribsOrange" width="2.6" height="32" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1.1" height="32" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="1.3" y="0" width="1.1" height="32" fill="#000000" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <g stroke="#111214" stroke-width="0.6" stroke-linejoin="round">


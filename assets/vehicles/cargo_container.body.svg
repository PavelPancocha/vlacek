    <rect x="96" y="8" width="83" height="32" fill="url(#ribsOrange)" stroke="none"/>
    <rect x="96" y="8" width="83" height="2.4" fill="#8f3a02" stroke-width="0.4"/>
    <rect x="96" y="37.6" width="83" height="2.4" fill="#8f3a02" stroke-width="0.4"/>
    <rect x="96" y="8" width="2.6" height="32" fill="#8f3a02" stroke-width="0.4"/>
    <rect x="176.4" y="8" width="2.6" height="32" fill="#8f3a02" stroke-width="0.4"/>
    <path d="M99 10.8 H176" stroke="#f8c48f" stroke-width="0.5" fill="none"/>
    <g fill="#2a2d33" stroke-width="0.3">

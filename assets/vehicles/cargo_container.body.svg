    <rect x="4" y="37" width="7" height="14" rx="0.8" fill="url(#frameBlue)"/>
    <rect x="177" y="37" width="7" height="14" rx="0.8" fill="url(#frameBlue)"/>
    <rect x="1.6" y="42.4" width="2.6" height="3.2" fill="url(#steel)"/>
    <rect x="0.2" y="40.2" width="1.9" height="7.6" rx="0.8" fill="#dfe3e8"/>
    <rect x="183.8" y="42.4" width="2.6" height="3.2" fill="url(#steel)"/>
    <rect x="185.9" y="40.2" width="1.9" height="7.6" rx="0.8" fill="#dfe3e8"/>
    <path d="M4 48 H2.6 Q1.3 48 1.3 49.6 V50.6 H2.6 M184 48 H185.4 Q186.7 48 186.7 49.6 V50.6 H185.4" fill="none" stroke-width="0.9"/>

    <rect x="163" y="30" width="10" height="5.4" rx="0.4" fill="#f3e9c6" fill-opacity="0.9" stroke-width="0.3"/>
    <path d="M164.4 31.6 H171.6 M164.4 33 H170" stroke="#555a62" stroke-width="0.35" fill="none"/>

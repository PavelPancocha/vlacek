<svg xmlns="http://www.w3.org/2000/svg" width="164" height="76" viewBox="0 0 164 76">
  <!-- Krytý nákladní (cargo_box): oxide-red plank body in a steel frame with diagonal braces, sliding door on rails, barred vents, curved roof. Rail top at y = 76, buffers 30 u above the rail. -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3d8de"/><stop offset="0.5" stop-color="#8b9199"/><stop offset="1" stop-color="#555a62"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f57"/><stop offset="0.4" stop-color="#2c2f35"/><stop offset="1" stop-color="#16181b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf5fb"/><stop offset="0.45" stop-color="#a9cde3"/><stop offset="1" stop-color="#5f8fae"/>
    </linearGradient>
    <linearGradient id="planks" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5523c"/><stop offset="0.5" stop-color="#8e3b2c"/><stop offset="1" stop-color="#5e2419"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a3022"/><stop offset="0.5" stop-color="#9c4733"/><stop offset="1" stop-color="#6b291d"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa0a8"/><stop offset="0.5" stop-color="#6e747c"/><stop offset="1" stop-color="#474c53"/>
    </linearGradient>
  </defs>

  <g stroke="#111214" stroke-width="0.6" stroke-linejoin="round">

    <!-- Headstocks with buffers (30 u above the rail), couplings, hoses. -->
    <rect x="4" y="39" width="7" height="14" rx="0.8" fill="url(#dark)"/>
    <rect x="153" y="39" width="7" height="14" rx="0.8" fill="url(#dark)"/>
    <rect x="1.6" y="44.4" width="2.6" height="3.2" fill="url(#steel)"/>
    <rect x="0.2" y="42.2" width="1.9" height="7.6" rx="0.8" fill="#dfe3e8"/>
    <rect x="159.8" y="44.4" width="2.6" height="3.2" fill="url(#steel)"/>
    <rect x="161.9" y="42.2" width="1.9" height="7.6" rx="0.8" fill="#dfe3e8"/>
    <path d="M4 50 H2.6 Q1.3 50 1.3 51.6 V52.6 H2.6 M160 50 H161.4 Q162.7 50 162.7 51.6 V52.6 H161.4" fill="none" stroke-width="0.9"/>
    <path d="M8.4 53 Q9 58 6.4 60 M155.6 53 Q155 58 157.6 60" stroke="#16171a" stroke-width="1.4" fill="none"/>
    <!-- Solebar and brake cylinder. -->
    <rect x="5" y="43.4" width="154" height="5.6" fill="url(#dark)"/>
    <path d="M5.6 44.2 H158.4" stroke="#6a707a" stroke-width="0.4" fill="none"/>
    <rect x="70" y="49" width="12" height="5" rx="2.4" fill="url(#steel)"/>
    <path d="M82 51.4 H96" stroke="#3a3d44" stroke-width="0.8" fill="none"/>
    <!-- Plank body. -->
    <rect x="6" y="13" width="152" height="30.6" fill="url(#planks)"/>
    <path d="M7 16.4 H157 M7 19.599999999999998 H157 M7 22.799999999999997 H157 M7 26 H157 M7 29.2 H157 M7 32.4 H157 M7 35.6 H157 M7 38.8 H157 M7 42 H157" stroke="#4a1a12" stroke-width="0.45" fill="none"/>
    <path d="M7 14.2 H157" stroke="#d9785f" stroke-width="0.4" fill="none"/>
    <!-- Steel frame: stanchions, diagonal braces, waist rail. -->
    <rect x="5.8" y="13" width="2" height="30.6" fill="url(#dark)" stroke-width="0.35"/><rect x="21" y="13" width="2" height="30.6" fill="url(#dark)" stroke-width="0.35"/><rect x="37" y="13" width="2" height="30.6" fill="url(#dark)" stroke-width="0.35"/><rect x="51" y="13" width="2" height="30.6" fill="url(#dark)" stroke-width="0.35"/><rect x="111" y="13" width="2" height="30.6" fill="url(#dark)" stroke-width="0.35"/><rect x="125" y="13" width="2" height="30.6" fill="url(#dark)" stroke-width="0.35"/><rect x="141" y="13" width="2" height="30.6" fill="url(#dark)" stroke-width="0.35"/><rect x="156.2" y="13" width="2" height="30.6" fill="url(#dark)" stroke-width="0.35"/>
    <path d="M23 42.6 L37 14 M51 42.6 L39 14 M113 42.6 L125 14 M141 42.6 L127 14" stroke="#2a2d33" stroke-width="1.6" fill="none"/>
    <path d="M23 42.6 L37 14 M113 42.6 L125 14" stroke="#6a707a" stroke-width="0.35" fill="none"/>
    <rect x="6" y="27.6" width="152" height="1.6" fill="url(#dark)" stroke-width="0.35"/>
    <g fill="#8b9199" stroke="none">
      <circle cx="6.8" cy="17" r="0.4"/><circle cx="6.8" cy="40" r="0.4"/><circle cx="22" cy="17" r="0.4"/><circle cx="22" cy="40" r="0.4"/><circle cx="38" cy="17" r="0.4"/><circle cx="38" cy="40" r="0.4"/><circle cx="52" cy="17" r="0.4"/><circle cx="52" cy="40" r="0.4"/><circle cx="112" cy="17" r="0.4"/><circle cx="112" cy="40" r="0.4"/><circle cx="126" cy="17" r="0.4"/><circle cx="126" cy="40" r="0.4"/><circle cx="142" cy="17" r="0.4"/><circle cx="142" cy="40" r="0.4"/><circle cx="157.2" cy="17" r="0.4"/><circle cx="157.2" cy="40" r="0.4"/>
    </g>
    <!-- Barred vent windows high on the side. -->
    <rect x="12" y="16" width="7" height="4" rx="0.5" fill="#1b0c08"/>
    <path d="M13.8 16 V20 M15.5 16 V20 M17.2 16 V20" stroke="#6a707a" stroke-width="0.4"/>
    <rect x="145" y="16" width="7" height="4" rx="0.5" fill="#1b0c08"/>
    <path d="M146.8 16 V20 M148.5 16 V20 M150.2 16 V20" stroke="#6a707a" stroke-width="0.4"/>
    <!-- Sliding door on top and bottom rails, with handle and seal. -->
    <path d="M58 13.8 H106 M58 43 H106" stroke="url(#steel)" stroke-width="1.1" fill="none"/>
    <rect x="64" y="14.6" width="36" height="28" fill="url(#door)"/>
    <path d="M64 18 H100 M64 21.2 H100 M64 24.4 H100 M64 27.6 H100 M64 30.8 H100 M64 34 H100 M64 37.2 H100 M64 40.4 H100" stroke="#4a1a12" stroke-width="0.4" fill="none"/>
    <path d="M64.6 15.2 L99.4 42 M99.4 15.2 L64.6 42" stroke="#2a2d33" stroke-width="1.4" fill="none"/>
    <rect x="64" y="14.6" width="36" height="28" fill="none" stroke="#2a2d33" stroke-width="1.4"/>
    <circle cx="66.6" cy="13.8" r="1.1" fill="url(#steel)" stroke-width="0.3"/>
    <circle cx="97.4" cy="13.8" r="1.1" fill="url(#steel)" stroke-width="0.3"/>
    <rect x="95" y="27" width="1.6" height="5.2" rx="0.6" fill="url(#steel)" stroke-width="0.3"/>
    <rect x="70" y="30" width="5" height="3" rx="0.4" fill="#f3e9c6" stroke-width="0.3"/>
    <!-- Data marks (no operator logos) and a chalk tally. -->
    <path d="M116 33 H136 M116 35 H130 M116 37 H134" stroke="#f3e9c6" stroke-width="0.6" stroke-opacity="0.85" fill="none"/>
    <path d="M26 34 V38 M27.4 34 V38 M28.8 34 V38 M25.4 37.4 L30 34.6" stroke="#ffffff" stroke-opacity="0.75" stroke-width="0.4" fill="none"/>
    <!-- Curved roof with rain strips. -->
    <path d="M4.8 13.6 Q6 8.4 20 7.8 H144 Q158 8.4 159.2 13.6 Z" fill="url(#roof)"/>
    <path d="M5.2 13 H158.8" stroke="#2f3337" stroke-width="0.5" fill="none"/>
    <path d="M20 8.8 H144" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.5" fill="none"/>
    <path d="M30 8 V13 M55 8 V13 M82 7.8 V13 M109 8 V13 M134 8 V13" stroke="#474c53" stroke-width="0.4" fill="none"/>
  </g>
</svg>

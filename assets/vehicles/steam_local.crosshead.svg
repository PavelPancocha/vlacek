<svg xmlns="http://www.w3.org/2000/svg" width="30" height="7" viewBox="0 0 30 7">
  <!-- Crosshead (gudgeon pin at (3.5, 3.5)) sliding between the guide bars,
       and the piston rod. Its end (x 26) stays inside the cylinder over the
       whole 14 u stroke, so the cylinder in the overlay always hides it. -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f4"/>
      <stop offset="0.5" stop-color="#a7adb5"/>
      <stop offset="1" stop-color="#5b6068"/>
    </linearGradient>
  </defs>
  <g stroke="#111214" stroke-width="0.4">
    <rect x="7" y="2.75" width="19" height="1.5" rx="0.6" fill="url(#steel)"/>
    <rect x="0.2" y="0.3" width="7.4" height="1.5" rx="0.4" fill="#4a4e55"/>
    <rect x="0.2" y="5.2" width="7.4" height="1.5" rx="0.4" fill="#4a4e55"/>
    <rect x="0.8" y="1.4" width="6.2" height="4.2" rx="0.8" fill="url(#steel)"/>
    <circle cx="3.5" cy="3.5" r="1.05" fill="#3a3d44"/>
    <path d="M5.6 2 V5" stroke="#6b7179" stroke-width="0.3"/>
  </g>
</svg>

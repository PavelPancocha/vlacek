<svg xmlns="http://www.w3.org/2000/svg" width="188" height="84" viewBox="0 0 188 84">
  <!-- Jeřábový vagón (service_crane): railway crane on two bogies, machinery house with operator, striped counterweight, lattice jib laid forward on its rest with the hook block. Rail top at y = 84, buffers 30 u above the rail. -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3d8de"/><stop offset="0.5" stop-color="#8b9199"/><stop offset="1" stop-color="#555a62"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f57"/><stop offset="0.4" stop-color="#2c2f35"/><stop offset="1" stop-color="#16181b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf5fb"/><stop offset="0.45" stop-color="#a9cde3"/><stop offset="1" stop-color="#5f8fae"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9e07a"/><stop offset="0.45" stop-color="#f1c40f"/><stop offset="1" stop-color="#b9900a"/>
    </linearGradient>
    <linearGradient id="jib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7dc6f"/><stop offset="1" stop-color="#c99a0b"/>
    </linearGradient>
    <linearGradient id="frameGrey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a707a"/><stop offset="0.4" stop-color="#3a3e45"/><stop offset="1" stop-color="#1b1d21"/>
    </linearGradient>
    <radialGradient id="beacon" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fdebd0"/><stop offset="0.5" stop-color="#f39c12"/><stop offset="1" stop-color="#a04000"/>
    </radialGradient>
  </defs>

  <g stroke="#111214" stroke-width="0.6" stroke-linejoin="round">

    <!-- Headstocks with buffers (30 u above the rail), couplings, hoses. -->
    <rect x="4" y="47" width="7" height="14" rx="0.8" fill="url(#frameGrey)"/>
    <rect x="177" y="47" width="7" height="14" rx="0.8" fill="url(#frameGrey)"/>
    <rect x="1.6" y="52.4" width="2.6" height="3.2" fill="url(#steel)"/>
    <rect x="0.2" y="50.2" width="1.9" height="7.6" rx="0.8" fill="#dfe3e8"/>
    <rect x="183.8" y="52.4" width="2.6" height="3.2" fill="url(#steel)"/>
    <rect x="185.9" y="50.2" width="1.9" height="7.6" rx="0.8" fill="#dfe3e8"/>
    <path d="M4 58 H2.6 Q1.3 58 1.3 59.6 V60.6 H2.6 M184 58 H185.4 Q186.7 58 186.7 59.6 V60.6 H185.4" fill="none" stroke-width="0.9"/>
    <path d="M8.4 61 Q9 66 6.4 68 M179.6 61 Q179 66 181.6 68" stroke="#16171a" stroke-width="1.4" fill="none"/>
    <!-- Frame with folded outriggers and jack pads. -->
    <rect x="5" y="49.6" width="178" height="7.4" fill="url(#frameGrey)"/>
    <path d="M5.6 50.4 H182.4" stroke="#9aa0a8" stroke-width="0.4" fill="none"/>
    <clipPath id="c5.247"><rect x="5.2" y="47" width="6" height="3"/></clipPath><rect x="5.2" y="47" width="6" height="3" fill="#f4d03f"/><path d="M2.2 50 L5.2 47 L7.2 47 L4.2 50 Z M6.2 50 L9.2 47 L11.2 47 L8.2 50 Z M10.2 50 L13.2 47 L15.2 47 L12.2 50 Z " fill="#1b1b1b" stroke="none" clip-path="url(#c5.247)"/><rect x="5.2" y="47" width="6" height="3" fill="none"/><clipPath id="c176.847"><rect x="176.8" y="47" width="6" height="3"/></clipPath><rect x="176.8" y="47" width="6" height="3" fill="#f4d03f"/><path d="M173.8 50 L176.8 47 L178.8 47 L175.8 50 Z M177.8 50 L180.8 47 L182.8 47 L179.8 50 Z M181.8 50 L184.8 47 L186.8 47 L183.8 50 Z " fill="#1b1b1b" stroke="none" clip-path="url(#c176.847)"/><rect x="176.8" y="47" width="6" height="3" fill="none"/>
    <rect x="58" y="51.6" width="16" height="3.6" rx="0.6" fill="url(#yellow)" stroke-width="0.4"/>
    <rect x="114" y="51.6" width="16" height="3.6" rx="0.6" fill="url(#yellow)" stroke-width="0.4"/>
    <rect x="59" y="55.2" width="4.4" height="3.6" rx="0.6" fill="url(#dark)" stroke-width="0.4"/>
    <rect x="124.6" y="55.2" width="4.4" height="3.6" rx="0.6" fill="url(#dark)" stroke-width="0.4"/>
    <!-- Jib rest (A-frame) at the front. -->
    <path d="M163 49.6 L167 34 H171 L175 49.6 H172 L169.4 37.6 H168.6 L166 49.6 Z" fill="url(#yellow)"/>
    <!-- Turntable and machinery house. -->
    <rect x="34" y="45.4" width="60" height="4.4" rx="1.4" fill="url(#frameGrey)"/>
    <path d="M38 46.6 H90" stroke="#9aa0a8" stroke-width="0.35" fill="none"/>
    <clipPath id="c1628"><rect x="16" y="28" width="15" height="17.4"/></clipPath><rect x="16" y="28" width="15" height="17.4" fill="#f4d03f"/><path d="M-1.4 45.4 L16 28 L18 28 L0.6 45.4 Z M2.6 45.4 L20 28 L22 28 L4.6 45.4 Z M6.6 45.4 L24 28 L26 28 L8.6 45.4 Z M10.6 45.4 L28 28 L30 28 L12.6 45.4 Z M14.6 45.4 L32 28 L34 28 L16.6 45.4 Z M18.6 45.4 L36 28 L38 28 L20.6 45.4 Z M22.6 45.4 L40 28 L42 28 L24.6 45.4 Z M26.6 45.4 L44 28 L46 28 L28.6 45.4 Z M30.6 45.4 L48 28 L50 28 L32.6 45.4 Z " fill="#1b1b1b" stroke="none" clip-path="url(#c1628)"/><rect x="16" y="28" width="15" height="17.4" fill="none"/>
    <path d="M31 45.4 V22 Q31 17 36 17 H80 Q86 17 88 22 L92 34 V45.4 Z" fill="url(#yellow)"/>
    <path d="M32 21 Q33 18.2 36 18.2 H80" stroke="#fcf3cf" stroke-width="0.6" fill="none"/>
    <path d="M31.6 40 H91.6" stroke="#000000" stroke-opacity="0.25" stroke-width="1.4" fill="none"/>

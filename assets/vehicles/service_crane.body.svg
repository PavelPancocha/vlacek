    <clipPath id="cab"><path d="M70 22.4 H80.6 Q83.4 22.4 84.4 25 L87.4 33.6 H70 Z"/></clipPath>
    <g clip-path="url(#cab)">
      <rect x="69" y="21" width="20" height="14" fill="#2b3a44" stroke="none"/>

      <path d="M73.80000000000001 38.2 Q73.80000000000001 32.6 78.4 32.4 Q83 32.6 83 38.2 Z" fill="#e67e22" stroke-width="0.35"/>
      <rect x="77.5" y="31" width="1.8" height="1.8" fill="#e0ac69" stroke="none"/>
      <circle cx="78.4" cy="29.2" r="2.5" fill="#e0ac69" stroke-width="0.35"/>
      <path d="M75.2 28.2 H81.60000000000001 V27.4 H80.60000000000001 Q80.4 25 78.4 25 Q76.4 25 76.2 27.4 H75.2 Z" fill="#1b1b1b" stroke-width="0.3"/>
      <rect x="69" y="21" width="20" height="14" fill="#a9cde3" fill-opacity="0.28" stroke="none"/>
      <path d="M72 33 L77 23 M76.4 33.4 L80.4 25.6" stroke="#ffffff" stroke-opacity="0.5" stroke-width="0.6"/>
    </g>
    <path d="M70 22.4 H80.6 Q83.4 22.4 84.4 25 L87.4 33.6 H70 Z" fill="none"/>
    <path d="M38 45 V24 H48 V45" fill="none" stroke="#b9900a" stroke-width="0.6"/>
    <rect x="40" y="26" width="6" height="6" rx="0.8" fill="url(#glass)" stroke-width="0.45"/>
    <rect x="46" y="35" width="1" height="2.8" rx="0.4" fill="url(#steel)" stroke-width="0.25"/>
    <rect x="52" y="24" width="14" height="14" rx="0.6" fill="#d4ac0d" stroke-width="0.45"/>
    <path d="M53 26 H65 M53 28 H65 M53 30 H65 M53 32 H65 M53 34 H65 M53 36 H65" stroke="#7d6608" stroke-width="0.5" fill="none"/>
    <!-- Roof: exhaust, beacon, railing. -->
    <rect x="58" y="12" width="3" height="5.4" fill="url(#dark)"/>
    <rect x="57.4" y="11.4" width="4.2" height="1.2" rx="0.4" fill="#2a2d33"/>
    <rect x="68.4" y="14.4" width="5" height="2.6" rx="0.6" fill="url(#dark)"/>
    <path d="M69.2 14.6 Q70.9 10.8 72.6 14.6 Z" fill="url(#beacon)" stroke-width="0.4"/>
    <path d="M34 17 V13.6 H50 V17 M42 13.6 V17" stroke="url(#steel)" stroke-width="0.6" fill="none"/>
    <!-- Hoist rope from the winch to the jib tip, hook block. -->
    <path d="M84 24 L178.6 31" stroke="#2a2d33" stroke-width="0.5" fill="none"/>
    <path d="M180 34.4 V44" stroke="#2a2d33" stroke-width="0.5" fill="none"/>
    <!-- Lattice jib. -->
    <path d="M86 33 L180 30 V35 L86 43 Z" fill="url(#jib)" fill-opacity="0.25"/>
    <path d="M88 42.83 L94 32.74 M94 32.74 L100 41.81 M100 41.81 L106 32.36 M106 32.36 L112 40.79 M112 40.79 L118 31.98 M118 31.98 L124 39.77 M124 39.77 L130 31.6 M130 31.6 L136 38.74 M136 38.74 L142 31.21 M142 31.21 L148 37.72 M148 37.72 L154 30.83 M154 30.83 L160 36.7 M160 36.7 L166 30.45 M166 30.45 L172 35.68 M172 35.68 L178 30.06 " stroke="#b9900a" stroke-width="0.9" fill="none"/>
    <path d="M86 33 L180 30 M86 43 L180 35" stroke="url(#jib)" stroke-width="2" fill="none"/>
    <path d="M86 33 L180 30 M86 43 L180 35" stroke="#7d6608" stroke-width="0.35" fill="none"/>
    <circle cx="86" cy="38" r="3" fill="url(#dark)"/>
    <circle cx="86" cy="38" r="1" fill="url(#steel)" stroke-width="0.3"/>
    <circle cx="179.4" cy="32.6" r="3.2" fill="url(#steel)"/>
    <circle cx="179.4" cy="32.6" r="1" fill="#2a2d33" stroke-width="0.3"/>
    <rect x="176.6" y="44" width="6.8" height="5.4" rx="1" fill="#c0392b"/>
    <path d="M177.6 45.4 H182.4" stroke="#f4d03f" stroke-width="0.8"/>
    <path d="M180 49.4 V51 Q180 53.4 178.2 53.4 Q176.6 53.4 176.6 51.8" stroke="url(#steel)" stroke-width="1.2" fill="none"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Disc wagon wheel, r 12 u, centre (12, 12): steel tyre, dished web
       with four lightening holes (they show the wheel turning), hub with
       bolts. Centred gradients only: it rotates. -->
  <defs>
    <radialGradient id="tyre" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.84" stop-color="#3a3e45"/>
      <stop offset="0.91" stop-color="#a4aab2"/>
      <stop offset="0.96" stop-color="#5a5f67"/>
      <stop offset="1" stop-color="#25272b"/>
    </radialGradient>
    <radialGradient id="web" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#454a52"/>
      <stop offset="0.45" stop-color="#2a2d32"/>
      <stop offset="0.8" stop-color="#3b3f46"/>
      <stop offset="1" stop-color="#1e2024"/>
    </radialGradient>
  </defs>
  <circle cx="12" cy="12" r="11.7" fill="url(#tyre)" stroke="#111214" stroke-width="0.5"/>
  <circle cx="12" cy="12" r="11.1" fill="none" stroke="#1d1f23" stroke-width="0.2"/>
  <circle cx="12" cy="12" r="10.2" fill="url(#web)" stroke="#111214" stroke-width="0.35"/>
  <circle cx="12" cy="12" r="8.4" fill="none" stroke="#50555d" stroke-width="0.35"/>
  <circle cx="12" cy="12" r="4.6" fill="none" stroke="#17181b" stroke-width="0.45"/>
  <g fill="#0b0c0e" stroke="#50555d" stroke-width="0.2">
    <circle cx="16.45" cy="16.45" r="0.75"/><circle cx="7.55" cy="16.45" r="0.75"/><circle cx="7.55" cy="7.55" r="0.75"/><circle cx="16.45" cy="7.55" r="0.75"/>
  </g>
  <circle cx="12" cy="12" r="3.3" fill="#33363c" stroke="#111214" stroke-width="0.3"/>
  <g fill="#8b9199">
    <circle cx="14.4" cy="12" r="0.33"/><circle cx="13.2" cy="14.08" r="0.33"/><circle cx="10.8" cy="14.08" r="0.33"/><circle cx="9.6" cy="12" r="0.33"/><circle cx="10.8" cy="9.92" r="0.33"/><circle cx="13.2" cy="9.92" r="0.33"/>
  </g>
  <circle cx="12" cy="12" r="1.1" fill="#b8bec6" stroke="#111214" stroke-width="0.25"/>

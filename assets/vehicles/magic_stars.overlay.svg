<svg xmlns="http://www.w3.org/2000/svg" width="164" height="100" viewBox="0 0 164 100">
  <!-- Hvězdičková mašinka: parts in front of the wheels and golden rods
       (fixed light on the tyres, cylinder, guide bars, cab step). -->
  <defs>
    <linearGradient id="cyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1a48"/>
      <stop offset="0.25" stop-color="#a569bd"/>
      <stop offset="0.5" stop-color="#5b2c6f"/>
      <stop offset="1" stop-color="#1f0e27"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#f4d03f"/>
      <stop offset="1" stop-color="#b7861a"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round">
    <g stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.1">
      <path d="M36.38 81.35 A14.1 14.1 0 0 1 53.65 71.38"/>
      <path d="M70.38 81.35 A14.1 14.1 0 0 1 87.65 71.38"/>
      <path d="M123.21 87.64 A9.1 9.1 0 0 1 134.36 81.21"/>
    </g>
    <g stroke="#000000" stroke-opacity="0.3" stroke-width="1.4">
      <path d="M63.62 88.65 A14.1 14.1 0 0 1 42.95 97.21"/>
      <path d="M97.62 88.65 A14.1 14.1 0 0 1 76.95 97.21"/>
      <path d="M140.79 92.36 A9.1 9.1 0 0 1 127.45 97.88"/>
    </g>
  </g>

  <g stroke="#1a0b21" stroke-width="0.6" stroke-linejoin="round">
    <!-- Motion bracket and guide bars. -->
    <path d="M107.4 69.8 H110.6 L110.2 81.8 H107.8 Z" fill="#2e1538"/>
    <rect x="109" y="72.2" width="20" height="1.6" rx="0.5" fill="url(#gold)"/>
    <rect x="109" y="80.2" width="20" height="1.6" rx="0.5" fill="url(#gold)"/>

    <!-- Cylinder with golden covers and bands. -->
    <rect x="130" y="63.4" width="16" height="7.2" rx="1.2" fill="url(#cyl)"/>
    <rect x="128" y="69.6" width="20" height="14.8" rx="3.6" fill="url(#cyl)"/>
    <path d="M133.4 69.8 V84.2 M142.6 69.8 V84.2" stroke="#f4d03f" stroke-width="0.9" fill="none"/>
    <path d="M129 72.4 H147" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.9" fill="none"/>
    <rect x="127" y="70.6" width="2.6" height="12.8" rx="1" fill="url(#gold)"/>
    <rect x="147" y="70.6" width="2.8" height="12.8" rx="1.2" fill="url(#gold)"/>
    <path d="M138.00 74.40 L138.61 75.88 L140.21 76.01 L138.99 77.05 L139.36 78.61 L138.00 77.78 L136.64 78.61 L137.01 77.05 L135.79 76.01 L137.39 75.88 Z" fill="url(#gold)" stroke="#8a6312" stroke-width="0.25"/>

    <!-- Cab step. -->
    <path d="M14.6 69.8 V83 M21.4 69.8 V83" stroke="url(#gold)" stroke-width="1" fill="none"/>
    <rect x="13.6" y="82.2" width="8.8" height="1.8" rx="0.6" fill="url(#gold)"/>
    <rect x="14.2" y="76" width="7.6" height="1.4" rx="0.5" fill="url(#gold)"/>
  </g>
</svg>

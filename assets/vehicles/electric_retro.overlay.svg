    <g>
      <path d="M31.6 58.6 V63 M40.4 58.6 V63" stroke="url(#spring)" stroke-width="3.2" stroke-linecap="butt"/>
      <path d="M30 59.6 H33.2 M30 61 H33.2 M38.8 59.6 H42 M38.8 61 H42" stroke="#0d2447" stroke-width="0.4"/>

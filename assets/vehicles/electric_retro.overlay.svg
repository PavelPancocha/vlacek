      <path d="M12.399999999999999 64 H59.6" stroke="#8b9199" stroke-width="0.4"/>
      <circle cx="20" cy="66.2" r="1.4" fill="#16181b" stroke="none"/>
      <circle cx="52" cy="66.2" r="1.4" fill="#16181b" stroke="none"/>
      <rect x="32" y="69.4" width="8" height="5.4" rx="1.4" fill="url(#box)"/>
      <rect x="33.4" y="70.4" width="5.2" height="2.6" rx="1.2" fill="#3a3d44" stroke-width="0.3"/>
      <path d="M21 69.4 V74.4 M51 69.4 V74.4" stroke="url(#spring)" stroke-width="3.6" stroke-linecap="butt"/>
      <path d="M19.2 70.6 H22.8 M19.2 72 H22.8 M19.2 73.4 H22.8 M49.2 70.6 H52.8 M49.2 72 H52.8 M49.2 73.4 H52.8" stroke="#0d2447" stroke-width="0.4"/>
      <rect x="17" y="74.4" width="8" height="9" rx="1.2" fill="url(#box)"/>
      <rect x="47" y="74.4" width="8" height="9" rx="1.2" fill="url(#box)"/>
      <circle cx="21" cy="79" r="1.8" fill="#4a4f57" stroke-width="0.4"/>
      <circle cx="51" cy="79" r="1.8" fill="#4a4f57" stroke-width="0.4"/>
      <!-- Brake shoes and sand pipes at the outer wheels. -->
      <path d="M9.4 78 Q7.6 82 9.4 86" stroke="#2a2d33" stroke-width="1.6" fill="none"/>
      <path d="M62.6 78 Q64.4 82 62.6 86" stroke="#2a2d33" stroke-width="1.6" fill="none"/>
      <path d="M12 69.4 L10.6 89.4 M60 69.4 L61.4 89.4" stroke="#3a3d44" stroke-width="0.7" fill="none"/>
      <rect x="9.600000000000001" y="69.2" width="4.4" height="5.4" rx="0.8" fill="url(#frame)"/>
      <rect x="58" y="69.2" width="4.4" height="5.4" rx="0.8" fill="url(#frame)"/>
    </g>
    <!-- Front bogie (centre x 152, axles 137 and 167). -->
    <g>
      <path d="M147.6 58.6 V63 M156.4 58.6 V63" stroke="url(#spring)" stroke-width="3.2" stroke-linecap="butt"/>
      <path d="M146 59.6 H149.2 M146 61 H149.2 M154.8 59.6 H158 M154.8 61 H158" stroke="#0d2447" stroke-width="0.4"/>
      <path d="M128 63 H176 Q178 63 178 65 V67.6 Q178 69.4 176 69.4 H163 L160 72.6 H144 L141 69.4 H128 Q126 69.4 126 67.6 V65 Q126 63 128 63 Z" fill="url(#frame)"/>
      <path d="M128.4 64 H175.6" stroke="#8b9199" stroke-width="0.4"/>
      <circle cx="136" cy="66.2" r="1.4" fill="#16181b" stroke="none"/>
      <circle cx="168" cy="66.2" r="1.4" fill="#16181b" stroke="none"/>
      <rect x="148" y="69.4" width="8" height="5.4" rx="1.4" fill="url(#box)"/>
      <rect x="149.4" y="70.4" width="5.2" height="2.6" rx="1.2" fill="#3a3d44" stroke-width="0.3"/>
      <path d="M137 69.4 V74.4 M167 69.4 V74.4" stroke="url(#spring)" stroke-width="3.6" stroke-linecap="butt"/>
      <path d="M135.2 70.6 H138.8 M135.2 72 H138.8 M135.2 73.4 H138.8 M165.2 70.6 H168.8 M165.2 72 H168.8 M165.2 73.4 H168.8" stroke="#0d2447" stroke-width="0.4"/>
      <rect x="133" y="74.4" width="8" height="9" rx="1.2" fill="url(#box)"/>
      <rect x="163" y="74.4" width="8" height="9" rx="1.2" fill="url(#box)"/>
      <circle cx="137" cy="79" r="1.8" fill="#4a4f57" stroke-width="0.4"/>
      <circle cx="167" cy="79" r="1.8" fill="#4a4f57" stroke-width="0.4"/>
      <!-- Brake shoes and sand pipes at the outer wheels. -->
      <path d="M125.4 78 Q123.6 82 125.4 86" stroke="#2a2d33" stroke-width="1.6" fill="none"/>
      <path d="M178.6 78 Q180.4 82 178.6 86" stroke="#2a2d33" stroke-width="1.6" fill="none"/>
      <path d="M128 69.4 L126.6 89.4 M176 69.4 L177.4 89.4" stroke="#3a3d44" stroke-width="0.7" fill="none"/>
      <rect x="125.6" y="69.2" width="4.4" height="5.4" rx="0.8" fill="url(#frame)"/>
      <rect x="174" y="69.2" width="4.4" height="5.4" rx="0.8" fill="url(#frame)"/>
    </g>
    <!-- Cab steps under the doors. -->
    <path d="M163 52.6 V64 M169.2 52.6 V64" stroke="url(#steel)" stroke-width="0.8"/>
    <rect x="162.2" y="57.6" width="7.8" height="1.4" rx="0.4" fill="url(#steel)"/>
    <rect x="162.2" y="63.2" width="7.8" height="1.4" rx="0.4" fill="url(#steel)"/>
    <path d="M18.6 52.6 V64 M24.8 52.6 V64" stroke="url(#steel)" stroke-width="0.8"/>
    <rect x="17.8" y="57.6" width="7.8" height="1.4" rx="0.4" fill="url(#steel)"/>
    <rect x="17.8" y="63.2" width="7.8" height="1.4" rx="0.4" fill="url(#steel)"/>
  </g>
</svg>

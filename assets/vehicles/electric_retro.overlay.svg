<svg xmlns="http://www.w3.org/2000/svg" width="188" height="92" viewBox="0 0 188 92">
  <!-- Hranatá elektrická lokomotiva: rámy podvozků s pružnicemi, ložiskovými
       skříněmi, brzdovými špalíky a pískovacími trubkami, schůdky kabin a
       stálý odlesk na otáčejících se obručích. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d636c"/>
      <stop offset="0.35" stop-color="#363a41"/>
      <stop offset="1" stop-color="#16181b"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a707a"/>
      <stop offset="1" stop-color="#26282c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e7ec"/>
      <stop offset="0.5" stop-color="#9aa0a8"/>
      <stop offset="1" stop-color="#5b6068"/>
    </linearGradient>
    <linearGradient id="spring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16181b"/>
      <stop offset="0.4" stop-color="#5d636c"/>
      <stop offset="1" stop-color="#16181b"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round">
    <g stroke="#ffffff" stroke-opacity="0.38" stroke-width="1">
      <path d="M9.31 75.87 A12.1 12.1 0 0 1 24.13 67.31"/>
      <path d="M39.31 75.87 A12.1 12.1 0 0 1 54.13 67.31"/>
      <path d="M125.31 75.87 A12.1 12.1 0 0 1 140.13 67.31"/>
      <path d="M155.31 75.87 A12.1 12.1 0 0 1 170.13 67.31"/>
    </g>
    <g stroke="#000000" stroke-opacity="0.3" stroke-width="1.3">
      <path d="M32.69 82.13 A12.1 12.1 0 0 1 14.95 89.48"/>
      <path d="M62.69 82.13 A12.1 12.1 0 0 1 44.95 89.48"/>
      <path d="M148.69 82.13 A12.1 12.1 0 0 1 130.95 89.48"/>
      <path d="M178.69 82.13 A12.1 12.1 0 0 1 160.95 89.48"/>
    </g>
  </g>
  <g stroke="#111214" stroke-width="0.6" stroke-linejoin="round">

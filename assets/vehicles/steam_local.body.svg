    </g>
    <g fill="#3d4148" stroke-width="0.4">
      <path d="M56.93 76.92 A15.25 15.25 0 0 1 56.93 93.08 L57.99 93.74 A16.5 16.5 0 0 0 57.99 76.26 Z"/>

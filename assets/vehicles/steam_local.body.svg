    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3d8de"/>
      <stop offset="0.5" stop-color="#8b9199"/>
      <stop offset="1" stop-color="#555a62"/>
    </linearGradient>
    <linearGradient id="pump" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121315"/>
      <stop offset="0.35" stop-color="#4f545c"/>
      <stop offset="0.6" stop-color="#25282d"/>
      <stop offset="1" stop-color="#0d0e10"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.4" cy="0.4" r="0.7">

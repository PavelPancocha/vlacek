    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf5fb"/>
      <stop offset="0.45" stop-color="#a9cde3"/>
      <stop offset="1" stop-color="#5f8fae"/>

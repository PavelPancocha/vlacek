      <stop offset="0.5" stop-color="#c8561d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0d0e10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dome" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#6a707a"/>
      <stop offset="0.35" stop-color="#363a41"/>
      <stop offset="1" stop-color="#121315"/>
    </radialGradient>
  </defs>


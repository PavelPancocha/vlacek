    <rect x="56.6" y="20.8" width="3.2" height="1.6" rx="0.6" fill="url(#brass)" stroke-width="0.4"/>
    <rect x="60" y="20.8" width="3.2" height="1.6" rx="0.6" fill="url(#brass)" stroke-width="0.4"/>
    <path d="M54.6 28 V19.6" stroke="#86611f" stroke-width="0.8" fill="none"/>

<svg xmlns="http://www.w3.org/2000/svg" width="156" height="100" viewBox="0 0 156 100">
  <!-- Malá parní mašinka (steam_local): everything behind the wheels and
       rods. Vehicle units: x from the rear coupler end, rail top at y = 100,
       faces right. Light comes from the upper left on every vehicle. -->
  <defs>
    <linearGradient id="boiler" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25282d"/>
      <stop offset="0.16" stop-color="#5d636c"/>
      <stop offset="0.3" stop-color="#3a3e45"/>
      <stop offset="0.75" stop-color="#1b1d21"/>
      <stop offset="1" stop-color="#0e0f11"/>
    </linearGradient>
    <linearGradient id="smokebox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2125"/>
      <stop offset="0.2" stop-color="#474c54"/>
      <stop offset="0.42" stop-color="#26282c"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="chimney" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141518"/>
      <stop offset="0.3" stop-color="#50555d"/>
      <stop offset="0.55" stop-color="#25272b"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40444b"/>
      <stop offset="0.1" stop-color="#2d3036"/>
      <stop offset="1" stop-color="#16181b"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dc4a43"/>
      <stop offset="0.5" stop-color="#b3242b"/>
      <stop offset="1" stop-color="#7a151b"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6df9c"/>
      <stop offset="0.45" stop-color="#cfa045"/>
      <stop offset="1" stop-color="#86611f"/>
    </linearGradient>
    <linearGradient id="brassV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86611f"/>
      <stop offset="0.35" stop-color="#f6df9c"/>
      <stop offset="0.6" stop-color="#cfa045"/>
      <stop offset="1" stop-color="#7a5719"/>

      <stop offset="0.86" stop-color="#7a5719"/>
      <stop offset="0.92" stop-color="#f6df9c"/>
      <stop offset="0.96" stop-color="#cfa045"/>
      <stop offset="1" stop-color="#6b4c16"/>

    <use href="#insulator" x="49" y="14.5"/><use href="#insulator" x="75" y="14.5"/>
    <rect x="44" y="14" width="36" height="1.5" rx=".5" fill="url(#slate)"/>
    <use href="#insulator" x="138" y="14.6"/><use href="#insulator" x="146" y="14.6"/>
    <path d="M80 15.6 H88 M131 15.6 H146" stroke="#aeb8b8" stroke-width=".8"/>
    <path d="M179 23 L179.8 24.5 H177" stroke="#435b65" stroke-width=".7" fill="none"/>

    <g id="insulator" stroke-width=".25"><rect x="-1" y="0" width="2" height="4" fill="#e4ddc9"/><path d="M-2 1 H2 M-2 2.3 H2 M-2 3.6 H2" stroke="#657c85" stroke-width=".7"/></g>
  </defs>

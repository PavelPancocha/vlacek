    <linearGradient id="silver" x2="0" y2="1"><stop stop-color="#f1f5f6"/><stop offset=".38" stop-color="#C8D0D4"/><stop offset="1" stop-color="#82969f"/></linearGradient>
    <linearGradient id="teal" x2="0" y2="1"><stop stop-color="#51a5af"/><stop offset=".4" stop-color="#247D86"/><stop offset="1" stop-color="#164c56"/></linearGradient>
    <linearGradient id="slate" x2="0" y2="1"><stop stop-color="#586f7b"/><stop offset=".45" stop-color="#344752"/><stop offset="1" stop-color="#1c2c35"/></linearGradient>
    <linearGradient id="steel" x2="0" y2="1"><stop stop-color="#e0e6e9"/><stop offset=".45" stop-color="#9AA0A8"/><stop offset="1" stop-color="#505f68"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#d9f1f7"/><stop offset=".38" stop-color="#8eb6c7"/><stop offset="1" stop-color="#263e4b"/></linearGradient>

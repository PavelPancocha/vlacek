    <linearGradient id="ballast" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7a29a"/><stop offset="1" stop-color="#7a756c"/>
    </linearGradient>
    <linearGradient id="verge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fae3e"/><stop offset="1" stop-color="#5f9a34"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4f6"/><stop offset="0.45" stop-color="#b4bac2"/><stop offset="1" stop-color="#6b7179"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b6a4a"/><stop offset="0.35" stop-color="#6d4c33"/><stop offset="1" stop-color="#47301f"/>
    </linearGradient>
  </defs>
  <!-- Grass verge below the ballast shoulder. -->
  <rect x="0" y="13.4" width="66" height="10.6" fill="url(#verge)"/>

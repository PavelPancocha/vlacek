  <!-- Track tile snow-b (snow verge): rail (top at y = 1), fastenings, wooden sleeper
       ends every 16 u, ballast and grass verge. Laid every 64 u along the
       track, so x 64–66 overlaps the next tile; the edges hold only
       x-invariant bands. The bottom row matches the embankment colour. -->

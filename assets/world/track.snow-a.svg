<svg xmlns="http://www.w3.org/2000/svg" width="66" height="24" viewBox="0 0 66 24">
  <!-- Track tile snow-a (snow verge): rail (top at y = 1), fastenings, wooden sleeper
       ends every 16 u, ballast and grass verge. Laid every 64 u along the
       track, so x 64–66 overlaps the next tile; the edges hold only
       x-invariant bands. The bottom row matches the embankment colour. -->
  <defs>
    <linearGradient id="ballast" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7a29a"/><stop offset="1" stop-color="#7a756c"/>
    </linearGradient>
    <linearGradient id="verge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fb"/><stop offset="1" stop-color="#dfe9f2"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4f6"/><stop offset="0.45" stop-color="#b4bac2"/><stop offset="1" stop-color="#6b7179"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b6a4a"/><stop offset="0.35" stop-color="#6d4c33"/><stop offset="1" stop-color="#47301f"/>
    </linearGradient>
  </defs>
  <!-- Grass verge below the ballast shoulder. -->
  <rect x="0" y="13.4" width="66" height="10.6" fill="url(#verge)"/>
  <!-- Ballast bed with stones. -->
  <path d="M0 5 H66 V15.6 Q49.5 17 33 15.8 Q16.5 17 0 15.6 Z" fill="url(#ballast)"/>
